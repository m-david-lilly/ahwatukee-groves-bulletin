<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ward Portal Demo</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
/* Layout: a presenter's guide on the left, a working phone on the right; on a phone the guide sits above the app. */
:root {
  --stage: #e9e4da; --panel: #fbf9f5; --frame: #1b1f24;
  --navy: #22384f; --on-navy: #ffffff; --accent: #2f5d7c; --on-accent: #ffffff; --link: #2f5d7c; --terra: #c7643a;
  --bg: #f6f3ed; --card: #ffffff; --ink: #1f2a37; --muted: #667180; --rule: #e6e0d4; --chip: #eaf1f6;
  --field: #ffffff; --field-rule: #d9d2c4; --ok: #2f6b3a; --ok-bg: #e2f2e6; --warn-bg: #fff7ef; --warn-rule: #f1d9c6;
  --pend: #8a6100; --pend-bg: #fff2cc; --off: #eceae4; --off-ink: #a3a8ae; --booked: #e3effa; --scrim: rgba(15, 22, 30, .45);
  --t-primary-bg: #fde8dc; --t-primary: #9a4220; --t-youth-bg: #e3effa; --t-youth: #2f5d7c; --t-rs-bg: #efe6f7; --t-rs: #6b3f8f;
  --t-eq-bg: #e2f2e6; --t-eq: #2f6b3a; --t-ward-bg: #f1ede3; --t-ward: #6b5a2c; --hero: #c7643a; --hero-2: #8f3d1c;
  --display: Georgia, "Iowan Old Style", "Times New Roman", serif;
  --body: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --stage: #0e1216; --panel: #161b21; --frame: #000000;
  --navy: #142333; --on-navy: #f2f5f8; --accent: #3f739a; --on-accent: #ffffff; --link: #8ec0e4; --terra: #e08a62;
  --bg: #12171d; --card: #1a2129; --ink: #e6eaee; --muted: #9aa6b2; --rule: #2a333d; --chip: #1e2c39;
  --field: #141a20; --field-rule: #36414d; --ok: #7cc68e; --ok-bg: #1b3324; --warn-bg: #2c2219; --warn-rule: #4a3626;
  --pend: #e8c46a; --pend-bg: #3a3017; --off: #20262d; --off-ink: #5f6a75; --booked: #1c2d3c; --scrim: rgba(0, 0, 0, .6);
  --t-primary-bg: #3a2419; --t-primary: #f0a882; --t-youth-bg: #1c2d3c; --t-youth: #8ec0e4; --t-rs-bg: #2b2236; --t-rs: #c9a4e6;
  --t-eq-bg: #1b3324; --t-eq: #7cc68e; --t-ward-bg: #2e2a1f; --t-ward: #d8c48e; --hero: #a8502b; --hero-2: #6b2c14; color-scheme: dark; } }
:root[data-theme="dark"] {
  --stage: #0e1216; --panel: #161b21; --frame: #000000;
  --navy: #142333; --on-navy: #f2f5f8; --accent: #3f739a; --on-accent: #ffffff; --link: #8ec0e4; --terra: #e08a62;
  --bg: #12171d; --card: #1a2129; --ink: #e6eaee; --muted: #9aa6b2; --rule: #2a333d; --chip: #1e2c39;
  --field: #141a20; --field-rule: #36414d; --ok: #7cc68e; --ok-bg: #1b3324; --warn-bg: #2c2219; --warn-rule: #4a3626;
  --pend: #e8c46a; --pend-bg: #3a3017; --off: #20262d; --off-ink: #5f6a75; --booked: #1c2d3c; --scrim: rgba(0, 0, 0, .6);
  --t-primary-bg: #3a2419; --t-primary: #f0a882; --t-youth-bg: #1c2d3c; --t-youth: #8ec0e4; --t-rs-bg: #2b2236; --t-rs: #c9a4e6;
  --t-eq-bg: #1b3324; --t-eq: #7cc68e; --t-ward-bg: #2e2a1f; --t-ward: #d8c48e; --hero: #a8502b; --hero-2: #6b2c14; color-scheme: dark; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--stage); color: var(--ink); font: 15px/1.45 var(--body); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--terra); outline-offset: 2px; }
.wrap { display: grid; grid-template-columns: minmax(0, 420px) auto; gap: 40px; justify-content: center; align-items: start;
  padding-block: 32px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* guide */
.guide { background: var(--panel); border: 1px solid var(--rule); border-radius: 18px; padding: 22px 22px 18px; display: grid; gap: 18px; min-width: 0; }
.guide h1 { font: 600 26px/1.15 var(--display); margin: 0; text-wrap: balance; }
.guide .intro { color: var(--muted); font-size: 14px; margin: 6px 0 0; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.roles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.roles button { border: 1.5px solid var(--rule); background: var(--card); border-radius: 10px; padding: 8px 10px; text-align: left; font-size: 13.5px; line-height: 1.25; }
.roles button small { display: block; color: var(--muted); font-size: 11.5px; }
.roles button[aria-pressed="true"] { border-color: var(--accent); background: var(--chip); font-weight: 600; }
.flows { display: grid; gap: 8px; }
.flow { border: 1px solid var(--rule); border-radius: 12px; background: var(--card); }
.flow summary { list-style: none; display: flex; gap: 10px; align-items: baseline; padding: 11px 13px; cursor: pointer; }
.flow summary::-webkit-details-marker { display: none; }
.flow .n { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--navy); color: var(--on-navy); font-size: 12px; font-weight: 700; display: grid; place-items: center; transform: translateY(3px); }
.flow summary b { display: block; font-size: 14.5px; }
.flow summary span.d { display: block; color: var(--muted); font-size: 12.5px; }
.flow ol { margin: 0; padding: 0 14px 12px 50px; font-size: 13px; display: grid; gap: 3px; }
.flow .go { margin: 0 14px 13px 45px; }
.small-btn { border: 0; background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 600; }
.small-btn.ghost { background: transparent; color: var(--link); border: 1.5px solid var(--accent); }
.guide .foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--rule); padding-top: 14px; }

/* phone */
.device { width: 390px; height: 812px; border-radius: 48px; background: var(--frame); padding: 12px; box-shadow: 0 30px 60px -20px rgba(20, 30, 40, .45); position: sticky; top: 24px; }
.phone { width: 100%; height: 100%; border-radius: 37px; overflow: hidden; background: var(--bg); position: relative; display: flex; flex-direction: column; }
.status { height: 34px; flex: none; display: flex; justify-content: space-between; align-items: center; padding: 0 26px; font-size: 13px; font-weight: 600; background: var(--navy); color: var(--on-navy); }
.appbar { flex: none; background: var(--navy); color: var(--on-navy); padding: 4px 18px 14px; display: flex; align-items: flex-end; gap: 10px; }
.appbar .t { flex: 1; min-width: 0; }
.appbar .ward { font: 600 20px/1.2 var(--display); text-wrap: balance; }
.appbar .sub { font-size: 12.5px; opacity: .8; }
.appbar .back { border: 0; background: transparent; color: var(--on-navy); font-size: 26px; line-height: 1; padding: 0 6px 2px 0; }
.appbar .share { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid currentColor; background: transparent; color: var(--on-navy); opacity: .9; display: grid; place-items: center; padding: 0; }
.appbar .share svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.appbar .pill { border: 1.5px solid currentColor; background: transparent; color: var(--on-navy); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; font-weight: 600; opacity: .9; }
.content { flex: 1; overflow-y: auto; padding: 14px 14px 24px; overscroll-behavior: contain; }
.tabbar { flex: none; height: 72px; background: var(--card); border-top: 1px solid var(--rule); display: flex; justify-content: space-around; padding: 8px 4px 0; }
.tab { position: relative; border: 0; background: transparent; text-align: center; font-size: 11px; color: var(--muted); width: 68px; }
.tab svg { width: 24px; height: 24px; display: block; margin: 0 auto 3px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.tab.on { color: var(--link); font-weight: 700; }
.badge { position: absolute; top: -3px; right: 12px; background: var(--terra); color: #fff; border-radius: 999px; font-size: 10.5px; font-weight: 700; padding: 0 6px; line-height: 17px; }

/* app parts */
.card { background: var(--card); border: 1px solid var(--rule); border-radius: 14px; padding: 13px 14px; margin-bottom: 12px; }
.card h3 { font: 600 15.5px/1.3 var(--display); margin: 0 0 6px; }
.card.note { background: var(--warn-bg); border-color: var(--warn-rule); }
.card.info { background: var(--chip); }
.card.good { background: var(--ok-bg); border-color: transparent; color: var(--ok); }
.lbl { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .07em; }
.muted { color: var(--muted); font-size: 13px; }
.lead { font-size: 13px; color: var(--muted); margin: 0 2px 10px; }
.lead b { color: var(--ink); }
.row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--rule); width: 100%; text-align: left; background: transparent; border-left: 0; border-right: 0; border-top: 0; }
.row:last-child { border-bottom: 0; }
.row .txt { flex: 1; min-width: 0; }
button.row:hover .txt b { color: var(--link); }
.chev { color: var(--muted); font-size: 18px; }
.date { width: 44px; text-align: center; border-radius: 10px; background: var(--chip); color: var(--link); padding: 4px 0; flex: none; }
.date b { display: block; font-size: 18px; line-height: 1.1; }
.date span { font-size: 10.5px; text-transform: uppercase; font-weight: 600; }
a.hymn { text-decoration: none; border: 1px solid transparent; }
a.hymn:hover, a.hymn:focus-visible { border-color: var(--link); }
.tag { display: inline-block; font-size: 10.5px; font-weight: 700; border-radius: 999px; padding: 1px 8px; margin-top: 3px; }
.t-primary { background: var(--t-primary-bg); color: var(--t-primary); } .t-youth { background: var(--t-youth-bg); color: var(--t-youth); }
.t-rs { background: var(--t-rs-bg); color: var(--t-rs); } .t-eq { background: var(--t-eq-bg); color: var(--t-eq); } .t-ward { background: var(--t-ward-bg); color: var(--t-ward); }
.t-pend { background: var(--pend-bg); color: var(--pend); } .t-ok { background: var(--ok-bg); color: var(--ok); }
.btn { display: block; width: 100%; text-align: center; background: var(--accent); color: var(--on-accent); border: 0; border-radius: 999px; padding: 11px; font-weight: 600; }
.btn.ghost { background: transparent; color: var(--link); border: 1.5px solid var(--accent); }
.btn.green { background: var(--ok); color: var(--card); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btns { display: flex; gap: 8px; }
.btns > * { flex: 1; }
.link { border: 0; background: transparent; color: var(--link); font-weight: 600; padding: 0; font-size: 13.5px; }
.f { margin-bottom: 11px; }
.f label, .f .label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px; }
.in { width: 100%; background: var(--field); border: 1px solid var(--field-rule); border-radius: 10px; padding: 9px 12px; font-size: 14px; }
textarea.in { resize: vertical; min-height: 76px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.chip { font-size: 12.5px; border: 1px solid var(--rule); background: var(--card); border-radius: 999px; padding: 5px 11px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.check { display: flex; gap: 9px; align-items: flex-start; font-size: 13.5px; margin: 4px 0 10px; }
.hrow { display: grid; grid-template-columns: 74px 1fr; align-items: center; gap: 6px; padding: 6px 0; border-bottom: 1px solid var(--rule); }
.hrow:last-of-type { border: 0; }
.hrow .check { margin: 0; }
.hrow .rng { display: flex; align-items: center; gap: 6px; font-size: 12.5px; }
.hrow select.in { padding: 5px 6px; font-size: 13px; width: auto; flex: 1; min-width: 0; }
.hrow .off { font-size: 12.5px; color: var(--muted); }
.check input { margin-top: 3px; accent-color: var(--accent); width: 16px; height: 16px; flex: none; }
.who { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; padding: 5px 0; border-bottom: 1px solid var(--rule); }
.who:last-child { border: 0; }
.open { color: var(--terra); font-weight: 700; }
.bar { height: 6px; border-radius: 3px; background: var(--chip); margin-bottom: 8px; }
.bar i { display: block; height: 6px; border-radius: 3px; background: var(--accent); }
.bar i.full { background: var(--ok); }
.sec { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.sec h3 { margin: 0; }
.cnt { font-size: 12px; font-weight: 700; color: var(--link); }
.cnt.full { color: var(--ok); }
.stat { display: flex; gap: 8px; margin: 6px 0 10px; }
.stat div { flex: 1; background: var(--chip); border-radius: 10px; padding: 7px 4px; text-align: center; }
.stat b { display: block; font-size: 22px; color: var(--link); font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--muted); }
.grid7 { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 13.5px; row-gap: 4px; }
.grid7 .h { color: var(--muted); font-size: 11px; font-weight: 700; }
.day { border: 0; background: transparent; padding: 2px 0 4px; border-radius: 10px; }
.day span { display: inline-block; width: 30px; height: 30px; line-height: 30px; border-radius: 50%; font-variant-numeric: tabular-nums; }
.day.sel span { background: var(--accent); color: var(--on-accent); font-weight: 700; }
.day.today span { box-shadow: inset 0 0 0 1.5px var(--terra); }
.dots { display: flex; justify-content: center; gap: 2px; height: 7px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; }
.d-primary { background: var(--t-primary); } .d-youth { background: var(--t-youth); } .d-rs { background: var(--t-rs); } .d-eq { background: var(--t-eq); } .d-ward { background: var(--t-ward); }
.mnav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.mnav b { font: 600 16px var(--display); }
.mnav button { border: 1px solid var(--rule); background: var(--card); border-radius: 999px; width: 32px; height: 32px; }
.mday span { display: inline-block; width: 32px; height: 32px; line-height: 29px; border-radius: 50%; }
.mday.fed span { background: var(--ok-bg); color: var(--ok); }
.mday.open span { border: 2px solid var(--terra); color: var(--terra); font-weight: 700; }
.mday.mine span { background: var(--ok); color: var(--card); font-weight: 700; }
.slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
.slotb { border-radius: 10px; padding: 9px 0; text-align: center; font-weight: 600; font-size: 13.5px; border: 1.5px solid var(--accent); color: var(--link); background: var(--card); font-variant-numeric: tabular-nums; }
.slotb.taken { border-color: transparent; background: var(--off); color: var(--off-ink); text-decoration: line-through; cursor: default; }
.slotb.mine { background: var(--ok); color: var(--card); border-color: var(--ok); }
.slot { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; font-size: 13.5px; padding: 8px 10px; border-radius: 9px; margin-bottom: 5px; border: 0; text-align: left; background: transparent; font-variant-numeric: tabular-nums; }
.slot.free { border: 1.5px dashed var(--accent); color: var(--link); font-weight: 600; }
.slot.booked { background: var(--booked); }
.slot.off { background: var(--off); color: var(--off-ink); cursor: default; }
.yt { font-size: 10.5px; font-weight: 700; color: var(--ok); background: var(--ok-bg); border-radius: 8px; padding: 1px 6px; margin-left: 4px; }
.seg { display: flex; gap: 6px; margin-bottom: 10px; }
.seg button { flex: 1; border: 1.5px solid var(--rule); border-radius: 10px; padding: 9px 0; font-weight: 600; background: var(--card); }
.seg button[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--card); }
.stepper { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.stepper div { display: flex; align-items: center; gap: 14px; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stepper button { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--accent); color: var(--link); background: transparent; font-size: 18px; line-height: 1; }
.lesson { background: var(--navy); color: var(--on-navy); border-radius: 14px; padding: 13px 14px; margin-bottom: 12px; }
.lesson h3 { font: 600 18px var(--display); margin: 3px 0 4px; }
.lesson .lbl { color: var(--on-navy); opacity: .7; }
.post { padding: 9px 0; border-bottom: 1px solid var(--rule); }
.post:last-child { border: 0; }
.post b { font-size: 13px; }
.post .when { font-size: 11.5px; color: var(--muted); margin-left: 6px; }
.post p { font-size: 13.5px; margin: 3px 0 0; }
.reply { margin-left: 14px; border-left: 3px solid var(--chip); padding-left: 10px; }
.board { background: #c79a63 radial-gradient(#b5874f 1px, transparent 1.5px) 0 0 / 7px 7px; border: 8px solid #8a5f33; border-radius: 10px; padding: 16px 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px 12px; }
.flyer { box-shadow: 0 4px 8px rgba(0, 0, 0, .25); padding: 20px 10px 12px; font-size: 13px; position: relative; min-height: 130px; color: #222; border: 0; text-align: left; }
.flyer b { font: 700 15px var(--display); display: block; margin-bottom: 4px; }
.flyer p { margin: 0; color: #333; font-size: 12.5px; }
.flyer .new { position: absolute; top: 4px; right: 6px; font-size: 9.5px; font-weight: 700; background: #c0392b; color: #fff; border-radius: 4px; padding: 0 5px; }
.pin { position: absolute; top: 6px; left: 50%; width: 13px; height: 13px; margin-left: -6px; border-radius: 50%; background: #c0392b; box-shadow: 0 2px 2px rgba(0, 0, 0, .35); }
.step { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; }
.step .t { width: 50px; flex: none; font-weight: 700; color: var(--link); font-size: 13.5px; font-variant-numeric: tabular-nums; }
.first { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #fff; background: var(--terra); border-radius: 999px; padding: 1px 7px; margin-left: 6px; }
.rm { display: flex; justify-content: space-between; gap: 8px; width: 100%; font-size: 13.5px; padding: 7px 8px; margin: 0 -8px; border-radius: 8px; border: 0; background: transparent; text-align: left; width: calc(100% + 16px); }
.rm span:last-child { color: var(--muted); white-space: nowrap; }
.rm.hl { background: var(--t-primary-bg); font-weight: 700; }
.rm.hl span:last-child { color: var(--t-primary); }
.map svg { display: block; width: 100%; height: auto; }
.map .room rect { fill: var(--bg); stroke: var(--field-rule); }
.map .room text { fill: var(--ink); font-size: 11px; }
.map .room.big rect { fill: var(--chip); }
.map .room.hl rect { fill: var(--terra); stroke: var(--terra); }
.map .room.hl text { fill: #fff; font-weight: 700; }
.map .shell { fill: var(--card); stroke: var(--navy); stroke-width: 2; }
.map .lab { fill: var(--muted); font-size: 11px; }
.map .you { fill: var(--ok); }
.prose p { font: 15.5px/1.6 var(--display); margin: 0 0 10px; }
.far { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--rule); }
.far:last-child { border: 0; }
.far .txt { flex: 1; min-width: 0; }
a.far { text-decoration: none; color: inherit; }
.far .sendn { border: 1.5px solid var(--accent); color: var(--link); background: transparent; border-radius: 999px; padding: 5px 11px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.grouphd { margin: 14px 4px 6px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; font-weight: 700; }
.list { padding: 2px 14px; }
.ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; font-weight: 700; font-size: 13px; }
.empty { text-align: center; padding: 18px 8px; color: var(--muted); font-size: 13.5px; }
.sms { background: var(--chip); border-radius: 14px 14px 14px 4px; padding: 9px 12px; font-size: 13.5px; margin-top: 8px; }

/* flyer images */
.flyer.pic { padding: 0; min-height: 0; background: #fff; }
.flyer.pic img { display: block; width: 100%; height: auto; }
.flyer.pic .pin { z-index: 1; }
.flyer.pic .new { z-index: 1; top: 6px; }
.fbig { display: block; width: 100%; max-height: 58vh; object-fit: contain; border-radius: 8px; background: var(--card-2, #f4f1ea); margin-bottom: 10px; }

// what a text alert for an announcement would say, how many texts each person gets, and what it costs
function textPlan(p) {
  const t = st.texting, msg = `AGW Ward: ${p.title}, ${dlabel(p.d)} ${p.from}, ${p.place}. Reply STOP to end.`;
  const parts = msg.length <= 160 ? 1 : Math.ceil(msg.length / 153);
  const cost = t.people * parts * TEXT_COST;
  return { msg, parts, cost, after: t.spent + cost, over: t.spent + cost > t.budget };
}
function textMeter() {
  const t = st.texting, pct = Math.min(100, Math.round(100 * t.spent / t.budget));
  const msg = pct >= 100 ? 'Budget reached. Texts go out as email until November 1. The bishop can approve an urgent ward-wide notice.'
    : pct >= 80 ? `Over 80% of the budget. The coordinator has been warned; at $${t.budget} texts switch to email until November 1.`
    : 'Budget set by the bishopric. The coordinator is warned at 80%; at 100% texts switch to email until next month.';
  return `<div class="card"><div class="sec"><h3>Ward texting this month</h3><span class="cnt" style="font-variant-numeric:tabular-nums">$${t.spent.toFixed(2)} of $${t.budget}</span></div>

}

function mapSvg(sel) {
  const rooms = Object.entries(ROOMS).map(([k, [x, y, w, h, n, big]]) => {
    const words = n.split(' '), lines = n.length > 11 && words.length > 1 ? [words.slice(0, Math.ceil(words.length / 2)).join(' '), words.slice(Math.ceil(words.length / 2)).join(' ')] : [n];
    const ty = y + h / 2 - (lines.length - 1) * 6 + 4;
    return `<g class="room ${big ? 'big' : ''} ${k === sel ? 'hl' : ''}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4"/>${lines.map((l, i) => `<text x="${x + w / 2}" y="${ty + i * 13}" text-anchor="middle">${l}</text>`).join('')}</g>`;
  }).join('');
  return `<div class="card map" style="padding:8px"><svg viewBox="0 0 340 420" role="img" aria-label="Meetinghouse map with ${ROOMS[sel][4]} highlighted">
    <rect class="shell" x="4" y="4" width="332" height="412" rx="8"/>${rooms}
    <text class="lab" x="185" y="200" text-anchor="middle">Foyer</text>
    <circle class="you" cx="300" cy="207" r="8"/><text x="300" y="211" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">★</text>
    <text class="lab" x="300" y="232" text-anchor="middle" style="font-weight:700">You are here</text><text class="lab" x="300" y="245" text-anchor="middle">(main doors)</text></svg>
    <div style="padding:6px 6px 4px"><b>${ROOMS[sel][4]}</b><div class="muted">${DIRECTIONS[sel] || ''}</div></div></div>`;
}

/* render */
let lastKey = '';
// the banner has a fixed height: shrink long text a little before the line clamp cuts it
function fitHero() {
  const h = document.querySelector('#phone .hero');
  if (!h) return;
  const sl = h.querySelector('.slide'), b = h.querySelector('b'), w = h.querySelector('.w'), box = b.parentElement;
  const cut = el => el.scrollHeight > el.clientHeight + 1;
  const tall = () => box.offsetHeight > sl.clientHeight - 8;
  let bs = 21, ws = 13;
  for (;;) {
    b.style.fontSize = bs + 'px'; w.style.fontSize = ws + 'px';
    if (!cut(b) && !cut(w) && !tall()) break;
    if (bs > 15 && (cut(b) || !cut(w) || ws <= 11)) bs--;
    else if (ws > 11) ws--;
    else break;
  }
}
function render(resetScroll) {
  const phone = document.getElementById('phone');
  const [name, arg] = cur();
  const key = name + (arg || '');
  const prev = phone.querySelector('.content');
  const keep = !resetScroll && key === lastKey && prev ? prev.scrollTop : 0;
  const [title, sub, body, tab] = S[name](arg);
  const back = st.stack.length > 1 ? '<button class="back" data-back aria-label="Back">‹</button>' : '';
  const lang = name === 'home' ? `<button class="pill" data-act="langMenu" aria-haspopup="dialog" aria-label="Language: ${LANGS[st.lang][1]}. Change language">${LANGS[st.lang][0]} ▾</button>` : '';
  const badge = { yw: pendingFor(), es: newRequests() }[st.role] || 0;
  const tabs = TABS.map(([k, n]) => `<button class="tab ${k === tab ? 'on' : ''}" data-tab="${k}"><svg viewBox="0 0 24 24">${ICONS[k]}</svg>${tr(n)}${k === 'more' && badge ? `<span class="badge">${badge}</span>` : ''}</button>`).join('');
  phone.innerHTML = `<div class="status"><span>9:41</span><span>Demo · agw.example</span><span>100%</span></div>
    <div class="appbar">${back}<div class="t"><div class="ward">${tr(title)}</div><div class="sub">${sub}</div></div>${lang}<button class="share" data-act="share" aria-label="Share a link to this page"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg></button></div>
    <div class="content">${body}</div><nav class="tabbar">${tabs}</nav>
    ${st.sheet ? `<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${st.sheet}</div></div>` : ''}`;
  fitHero();
  phone.querySelector('.content').scrollTop = keep;
  lastKey = key;
  renderGuide();
  syncUrl();
}

/* links: the address mirrors the screen, so the browser's Back button stays in the portal and any screen can be shared.
   #/more/contact?sheet=msg:bc   path = the screen stack, day = the calendar day, sheet = the open panel (action:value) */
let curAct = null, lastUrl = null, restoring = false, replaceNext = false;
const pathOf = stack => '#/' + stack.map(([n, a]) => (a ? `${n}:${encodeURIComponent(a)}` : n)).join('/');
function urlFor() {
  const q = new URLSearchParams();
  if (cur()[0] === 'calendar') q.set('day', st.cal.day);
  if (st.sheet && st.sheetKey) q.set('sheet', st.sheetKey);
  const qs = q.toString();
  return pathOf(st.stack) + (qs ? '?' + qs : '');
}
function syncUrl() {
  if (restoring) return;
  const u = urlFor();
  if (u === lastUrl) return;
  const path = u.split('?')[0], wasPath = (lastUrl || '').split('?')[0];
  const opened = st.sheet && !(lastUrl || '').includes('sheet=');
  try {
    // closing a panel steps back off its own history entry, so Back isn't pressed twice
    if (!st.sheet && history.state?.sheet && path === wasPath) { lastUrl = u; history.back(); return; }
    if (lastUrl === null || replaceNext || (path === wasPath && !opened)) history.replaceState({ prev: history.state?.prev ?? null, sheet: !!st.sheet }, '', u);
    else history.pushState({ prev: lastUrl, sheet: !!opened }, '', u);
  } catch (e) { /* some sandboxed frames block history; the portal still works */ }
  replaceNext = false; lastUrl = u;
}
function applyUrl(h) {
  const [path, qs = ''] = h.replace(/^#/, '').split('?'), q = new URLSearchParams(qs);
  const stack = path.split('/').filter(Boolean).map(s => { const i = s.indexOf(':'); return i < 0 ? [s] : [s.slice(0, i), decodeURIComponent(s.slice(i + 1))]; }).filter(([n]) => S[n]);
  if (!stack.length) stack.push(['home']);
  if (!TABS.some(([k]) => k === stack[0][0])) stack.unshift([stack[0][0] === 'where' ? 'sunday' : 'more']);
  st.stack = stack; st.sheet = null; st.sheetKey = null;
  const day = q.get('day');
  if (/^\d{4}-\d{2}-\d{2}$/.test(day || '')) { st.cal.day = day; st.cal.month = day.slice(0, 7); }
  const sh = q.get('sheet');
  if (sh) { const i = sh.indexOf(':'), act = i < 0 ? sh : sh.slice(0, i), v = i < 0 ? undefined : sh.slice(i + 1); if (A[act]) { curAct = sh; try { A[act](v); } catch (e) { st.sheet = null; } curAct = null; } }
}
addEventListener('popstate', () => {
  restoring = true; applyUrl(location.hash); restoring = false;
  const u = urlFor(); if (u === lastUrl) return; // our own step back after closing a panel: nothing to redraw
  lastUrl = u; render(true);
});

function go(target) {
  const [n, a] = target.split(':');
  st.stack.push([n, a]); st.sheet = null;
  if (n === 'signin') st.linkSent = false;
  render(true);
}

const phoneEl = document.getElementById('phone');
phoneEl.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-tab],[data-back],[data-act]');
  if (!t || !phoneEl.contains(t)) return;
  if (t.classList.contains('scrim') && e.target !== t) return;
  if (t.matches('input[type=checkbox][data-act], select[data-act]')) return;
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.tab) { st.stack = [[t.dataset.tab]]; st.sheet = null; if (t.dataset.tab === 'calendar') { st.cal.month = st.cal.day.slice(0, 7); } return render(true); }
  if ('back' in t.dataset) {
    if (history.state?.prev && history.state.prev.split('?')[0] === pathOf(st.stack.slice(0, -1))) return history.back();
    st.stack.pop(); st.sheet = null; replaceNext = true; return render(true);
  }
  curAct = t.dataset.act + (t.dataset.v !== undefined ? ':' + t.dataset.v : '');
  const r = A[t.dataset.act]?.(t.dataset.v, t);
  curAct = null;
  if (!st.sheet) st.sheetKey = null;
  if (r !== 'skip') render();
});
phoneEl.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('input[type=checkbox][data-act], select[data-act]')) { A[t.dataset.act](t.dataset.v, t); return render(); }
  if (t.dataset.f) st.f[t.dataset.f] = t.type === 'checkbox' ? t.checked : t.value;
});
phoneEl.addEventListener('change', e => {
  const t = e.target;
  if (t.id !== 'f-img' || !t.files[0]) return;
  if (t.files[0].size > 10e6) return toast('That image is over 10 MB. Try a smaller one.');
  const rd = new FileReader();
  rd.onload = () => { st.f.img = rd.result; render(); };
  rd.readAsDataURL(t.files[0]);
});
phoneEl.addEventListener('input', e => { const t = e.target; if (t.dataset.f && t.type !== 'checkbox') st.f[t.dataset.f] = t.value; });

function renderGuide() {
  document.getElementById('roles').innerHTML = Object.entries(ROLES).map(([k, [n, d]]) => `<button aria-pressed="${st.role === k}" data-role="${k}">${n}<small>${d}</small></button>`).join('');
}
document.getElementById('flows').innerHTML = FLOWS.map(([t, d, , , steps], i) => `<details class="flow" ${i === 0 ? 'open' : ''}><summary><span class="n">${i + 1}</span><span><b>${t}</b><span class="d">${d}</span></span></summary>
  <ol>${steps.map(s => `<li>${s}</li>`).join('')}</ol><div class="go"><button class="small-btn" data-flow="${i}">Start this flow</button></div></details>`).join('');
document.getElementById('roles').addEventListener('click', e => { const b = e.target.closest('[data-role]'); if (b) setRole(b.dataset.role, true); });
document.getElementById('flows').addEventListener('click', e => {
  const b = e.target.closest('[data-flow]'); if (!b) return;
  const f = FLOWS[b.dataset.flow]; st.role = f[2]; st.stack = f[3].map(x => [...x]); st.sheet = null; render(true);
});
document.getElementById('reset').addEventListener('click', () => { st = fresh(); render(true); toast('Demo reset.'); });
if (location.hash.length > 2) { restoring = true; applyUrl(location.hash); restoring = false; }
render(true);
setInterval(() => {
  if (st.heroPaused || st.sheet || !['home', 'sunday'].includes(cur()[0])) return;
  const el = document.querySelector('#phone .hero');
  if (!el) return;
  st.hero = (st.hero + 1) % (majors().length || 1);
  el.outerHTML = heroHtml();
  fitHero();
}, 6000);
})();
</script>
</body>
