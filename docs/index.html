<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ahwatukee Groves Ward Bulletin</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2f5d7c">
<style>
  :root {
    --bg: #f6f3ed; --card: #ffffff; --ink: #1f2a37; --muted: #667180; --rule: #e6e0d4;
    --accent: #2f5d7c; --accent-ink: #ffffff; --chip: #eaf1f6;
    --serif: Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #13171c; --card: #1c222a; --ink: #e9e6e0; --muted: #9ba5b0; --rule: #2d353f;
      --accent: #8db7d6; --accent-ink: #10202c; --chip: #23303b; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 var(--sans);
    -webkit-text-size-adjust: 100%; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }
  header { text-align: center; padding: 8px 0 20px; }
  header h1 { font: 600 1.75rem/1.2 var(--serif); margin: 0; }
  header .stake { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; margin-top: 4px; }
  header .sub { font: 1.1rem var(--serif); margin: 10px 0 2px; }
  header .when { color: var(--muted); font-size: .95rem; }
  .preview { background: #fff2cc; color: #5a4500; border-radius: 8px; padding: 8px 12px; margin-bottom: 12px;
    font-size: .9rem; text-align: center; }
  .grid { display: grid; gap: 16px; }
  @media (min-width: 860px) { .grid { grid-template-columns: 1fr 1fr; align-items: start; } }
  .card { background: var(--card); border: 1px solid var(--rule); border-radius: 14px; padding: 18px 18px 8px; }
  .card h2 { font: 600 1.15rem var(--serif); margin: 0 0 10px; letter-spacing: .01em; }
  .people { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 6px 16px;
    padding-bottom: 12px; margin-bottom: 4px; border-bottom: 1px solid var(--rule); }
  .people div { font-size: .95rem; }
  .lbl { display: block; color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; }
  ol.program { list-style: none; margin: 0; padding: 0; }
  ol.program li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
  ol.program li:last-child { border-bottom: 0; }
  ol.program .txt { flex: 1; min-width: 0; }
  ol.program .val { font-size: 1.02rem; }
  .num { flex: none; min-width: 3.4rem; text-align: center; font: 700 1.35rem/1 var(--sans);
    background: var(--chip); color: var(--accent); border-radius: 10px; padding: 10px 8px; }
  a.num { text-decoration: none; padding: 8px 8px 6px; border: 1px solid transparent; }
  a.num:hover, a.num:focus-visible { border-color: var(--accent); }
  a.num .go { display: block; font: 600 .62rem/1 var(--sans); letter-spacing: .06em; text-transform: uppercase;
    margin-top: 5px; opacity: .85; }
  li.section { justify-content: center; font: italic 1rem var(--serif); color: var(--muted); }
  .ann { padding: 12px 0; border-bottom: 1px solid var(--rule); }
  .ann:last-child { border-bottom: 0; }
  .ann h3 { font-size: 1.05rem; margin: 0 0 2px; }
  .ann .date { color: var(--accent); font-size: .9rem; font-weight: 600; margin-bottom: 4px; }
  .ann p { margin: 0; white-space: pre-line; overflow-wrap: anywhere; }
  .ann .contact { color: var(--muted); font-size: .88rem; margin-top: 4px; }
  .ann a, footer a.plain { color: var(--accent); }
  .ann h3 a.title { color: inherit; text-decoration-color: var(--accent); text-underline-offset: 3px; }
  .ann.linked { position: relative; margin: 0 -10px; padding-left: 10px; padding-right: 10px; border-radius: 10px; }
  .ann.linked:hover, .ann.linked:focus-within { background: var(--chip); }
  .ann.linked h3 a.title::after { content: ''; position: absolute; inset: 0; border-radius: 10px; } /* whole card is the link */
  .ann.linked h3 a.title:focus-visible { outline: none; }
  .ann.linked:has(a.title:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
  .ann.linked p a { position: relative; z-index: 1; } /* links in the details still open on their own */
  .ann .more { display: inline-block; color: var(--accent); margin-top: 6px; font-weight: 600; font-size: .92rem; text-decoration: none;
    border: 1.5px solid var(--accent); border-radius: 999px; padding: 6px 14px; }
  .empty { color: var(--muted); font-style: italic; padding: 8px 0 16px; }
  .wrap > .empty { text-align: center; padding-top: 30vh; }
  footer { text-align: center; margin-top: 24px; color: var(--muted); font-size: .9rem; }
  .btn { display: inline-block; background: var(--accent); color: var(--accent-ink); text-decoration: none;
    font-weight: 600; padding: 12px 20px; border-radius: 999px; margin: 4px 0 10px; }
  .foot { font-style: italic; margin: 10px 0; }
  footer .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 6px; }
  .btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
  .listen { margin: 4px 0 12px; padding: 14px; border-radius: 12px; background: var(--chip); text-align: center; }
  .listen h3 { font: 600 1rem var(--sans); margin: 0 0 2px; }
  .listen p { margin: 0 0 10px; font-size: .92rem; color: var(--muted); }
  .listen .stores { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; }
  .listen .stores img { display: block; height: 44px; width: auto; }
  .listen .stores a.play img { height: 64px; margin: -10px -9px; } /* Google's badge has built-in padding */
</style>
</head>
<body>
<div class="wrap" id="app"><p class="empty">Loading the bulletin…</p></div>
<script src="api.js"></script>
<script>
  function linkify(s) {
    return esc(s).replace(/\bhttps?:\/\/[^\s<]+[^\s<.,;:!?)\]'"]/g, function (u) {
      return '<a href="' + u + '" target="_blank" rel="noopener">' + u + '</a>';
    });
  }

  function hymnChip(it) {
    if (!it.url) return '<div class="num" aria-label="Hymn number ' + esc(it.number) + '">' + esc(it.number) + '</div>';
    return '<a class="num" href="' + esc(it.url) + '" target="_blank" rel="noopener" ' +
      'aria-label="Open hymn ' + esc(it.number) + ' in Gospel Library">' + esc(it.number) +
      '<span class="go">Open ›</span></a>';
  }

  function render(d) {
    var a = d.agenda, h = [];
    if (d.isPreview) h.push('<div class="preview">Preview — live sheet data, not yet published.</div>');
    h.push('<header>');
    h.push('<h1>' + esc(d.ward || 'Sacrament Meeting') + '</h1>');
    if (d.stake) h.push('<div class="stake">' + esc(d.stake) + '</div>');
    if (d.ward) h.push('<div class="sub">Sacrament Meeting</div>');
    h.push('<div class="when">' + esc(d.dateLabel) + '</div>');
    var times = [d.classesTime ? 'Classes ' + d.classesTime : '', d.meetingTime ? 'Sacrament Meeting ' + d.meetingTime : '']
      .filter(Boolean).join(' · ');
    if (times) h.push('<div class="when">' + esc(times) + '</div>');
    if (d.location) h.push('<div class="when">' + esc(d.location) + '</div>');
    h.push('</header><div class="grid">');

    h.push('<section class="card" aria-labelledby="p"><h2 id="p">Program</h2>');
    if (a.header.length) {
      h.push('<div class="people">' + a.header.map(function (x) {
        return '<div><span class="lbl">' + esc(x.label) + '</span>' + esc(x.value) + '</div>';
      }).join('') + '</div>');
    }
    h.push('<ol class="program">' + a.items.map(function (it) {
      if (it.type === 'section') return '<li class="section">' + esc(it.text) + '</li>';
      var val = it.type === 'hymn' ? it.title : it.value;
      return '<li><div class="txt"><span class="lbl">' + esc(it.label) + '</span><span class="val">' +
        esc(val) + '</span></div>' +
        (it.type === 'hymn' ? hymnChip(it) : '') + '</li>';
    }).join('') + '</ol>');
    var app = d.listenApp || {};
    if (app.ios || app.android) {
      // Official store badges, loaded from Apple and Google.
      h.push('<div class="listen"><h3>Listen on your phone</h3><p>Hear the meeting through your own headphones with the free ' +
        esc(app.name || 'listening') + ' app.</p><div class="stores">' +
        (app.ios ? '<a href="' + esc(app.ios) + '" target="_blank" rel="noopener"><img alt="Download on the App Store" ' +
          'src="https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/en-us?size=250x83"></a>' : '') +
        (app.android ? '<a class="play" href="' + esc(app.android) + '" target="_blank" rel="noopener"><img alt="Get it on Google Play" ' +
          'src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png"></a>' : '') +
        '</div></div>');
    }
    h.push('</section>');

    h.push('<section class="card" aria-labelledby="n"><h2 id="n">Announcements</h2>');
    if (!d.announcements.length) h.push('<div class="empty">No announcements this week.</div>');
    d.announcements.forEach(function (n) {
      // With a link, the whole card opens it (the title link stretches over the card), and a
      // "More info" button says so. Links inside the details stay separately tappable.
      var title = n.link ? '<a class="title" href="' + esc(n.link) + '" target="_blank" rel="noopener">' + esc(n.title) + '</a>' : esc(n.title);
      h.push('<article class="ann' + (n.link ? ' linked' : '') + '"><h3>' + title + '</h3>' +
        (n.when ? '<div class="date">' + esc(n.when) + '</div>' : '') +
        (n.details ? '<p>' + linkify(n.details) + '</p>' : '') +
        (n.contact ? '<div class="contact">Contact: ' + esc(n.contact) + '</div>' : '') +
        (n.link ? '<span class="more" aria-hidden="true">More info ›</span>' : '') + '</article>');
    });
    h.push('</section></div>');

    h.push('<footer><div class="actions"><a class="btn" href="' + esc(d.submitUrl) + '">Submit an announcement</a>');
    if (d.wardWebsite) {
      h.push('<a class="btn ghost" href="' + esc(d.wardWebsite) + '" target="_blank" rel="noopener">Ward website</a>');
    }
    if (d.missionaryMeals) {
      h.push('<a class="btn ghost" href="' + esc(d.missionaryMeals) + '" target="_blank" rel="noopener">Feed the missionaries</a>');
    }
    h.push('</div>');
    if (d.deadline) h.push('<div>Submissions for next Sunday are due ' + esc(d.deadline) + '.</div>');
    if (d.footer) h.push('<div class="foot">' + esc(d.footer) + '</div>');
    if (d.publishedAt) h.push('<div>Updated ' + esc(d.publishedAt) + '</div>');
    h.push('</footer>');
    document.getElementById('app').innerHTML = h.join('');
    document.title = (d.ward ? d.ward + ' — ' : '') + 'Sacrament Meeting';
  }

  // Show the last bulletin this phone saw right away (weak chapel Wi-Fi), then refresh it.
  var CACHE_KEY = 'ward-bulletin';
  var preview = location.search.indexOf('preview=1') !== -1;
  var shown = false;
  if (!preview) {
    try {
      var cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      if (cached) { render(cached); shown = true; }
    } catch (e) { /* storage unavailable */ }
  }
  apiGet({ api: 'bulletin', preview: preview ? 1 : '' }).then(function (d) {
    d.submitUrl = 'submit.html';
    render(d);
    if (!preview) {
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(d)); } catch (e) { /* storage unavailable */ }
    }
  }).catch(function (err) {
    if (!shown) {
      document.getElementById('app').innerHTML = '<p class="empty">Could not load the bulletin. ' +
        'Check your connection and refresh the page.<br><small>' + esc(err.message) + '</small></p>';
    }
  });
</script>
</body>
</html>
